<!-- campanhas-component.html -->
<div class="campanhas-wrapper">

  <!-- CABEÇALHO -->
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">Campanhas</h1>
      <p class="page-subtitle">{{ campanhas.length }} campanhas cadastradas</p>
    </div>
    <button class="btn-novo" (click)="novaCampanha()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Nova Campanha
    </button>
  </div>

  <!-- GRID DE CAMPANHAS -->
  <div class="campanhas-grid">
    <div class="campanha-card" *ngFor="let c of campanhas">

      <!-- Topo: título + status -->
      <div class="card-top">
        <div class="card-titulo-bloco">
          <span class="card-titulo">{{ c.titulo }}</span>
          <span class="card-datas">
            {{ formatarData(c.dataInicio) }} – {{ formatarData(c.dataFim) }}
          </span>
        </div>
        <span class="status-badge" [ngClass]="getStatusClass(c.status)">
          <span class="status-dot"></span>
          {{ getStatusLabel(c.status) }}
        </span>
      </div>

      <!-- Descrição -->
      <p class="card-descricao" *ngIf="c.descricao">{{ c.descricao }}</p>

      <!-- Rodapé: centro + ações -->
      <div class="card-footer">
        <span class="card-centro" *ngIf="c.idCentro != null">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Centro #{{ c.idCentro }}
        </span>
        <span class="card-centro sem-centro" *ngIf="c.idCentro == null">Sem centro vinculado</span>

        <button class="btn-excluir-card" (click)="excluirCampanha(c.id)" title="Excluir">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Estado vazio -->
    <div class="sem-campanhas" *ngIf="campanhas.length === 0">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <p>Nenhuma campanha cadastrada.</p>
    </div>
  </div>

</div>

<!-- MODAL -->
<app-modal-nova-campanha
  *ngIf="modalAberto"
  (fechar)="fecharModal()"
  (campanhaCriada)="aoCampanhaCriada($event)"
/>
