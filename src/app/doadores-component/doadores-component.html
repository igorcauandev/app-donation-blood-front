<div class="doadores-wrapper">

  <!-- CABEÇALHO -->
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">Doadores</h1>
      <p class="page-subtitle">{{ doadores.length }} doadores cadastrados</p>
    </div>
    <button class="btn-novo" (click)="novoDoador()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Novo Doador
    </button>
  </div>

  <!-- BARRA DE BUSCA -->
  <div class="search-wrapper">
    <span class="search-icon">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </span>
    <input
      class="search-input"
      type="text"
      placeholder="Buscar por nome, tipo sanguíneo ou e-mail..."
      [(ngModel)]="busca"
    />
  </div>

  <!-- TABELA -->
  <div class="table-container">
    <table class="tabela">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Tipo Sanguíneo</th>
          <th>Contato</th>
          <th>Gênero</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let doador of doadoresFiltrados">

          <!-- Nome (sem CPF, pois a API não retorna) -->
          <td class="td-nome">
            <span class="nome">{{ doador.nome }}</span>
          </td>

          <!-- Tipo sanguíneo -->
          <td>
            <span class="tipo-badge" [ngClass]="getTipoBgClass(doador.tipoSanguineo)">
              {{ doador.tipoSanguineo }}
            </span>
          </td>

          <!-- Contato -->
          <td class="td-contato">
            <span class="telefone">{{ doador.telefone }}</span>
            <span class="email">{{ doador.email }}</span>
          </td>

          <!-- Gênero -->
          <td class="td-genero">{{ doador.genero }}</td>

          <!-- Status derivado de elegivelParaDoar -->
          <td>
            <span class="status-badge" [ngClass]="getStatusClass(doador.elegivelParaDoar)">
              {{ getStatusLabel(doador.elegivelParaDoar) }}
            </span>
          </td>

          <!-- Ações -->
          <td class="td-acoes">
            <button class="btn-acao btn-editar" (click)="editarDoador(doador)" title="Editar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="btn-acao btn-excluir" (click)="excluirDoador(doador.id)" title="Excluir">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6"/><path d="M14 11v6"/>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
              </svg>
            </button>
          </td>
        </tr>

        <!-- Sem resultados -->
        <tr *ngIf="doadoresFiltrados.length === 0">
          <td colspan="6" class="sem-resultados">Nenhum doador encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- tudo que já tinha fica igual, só adiciona isso no final -->

<app-modal-novo-doador
  *ngIf="modalAberto"
  (fechar)="fecharModal()"
  (doadorCriado)="aoDoadorCriado($event)"
/>

<!-- ← ADD -->
<app-modal-atualizar-doador
  *ngIf="modalEditarAberto && doadorParaEditar"
  [doador]="doadorParaEditar!"
  (fechar)="fecharModalEditar()"
  (doadorAtualizado)="aoDoadorAtualizado($event)"
/>
