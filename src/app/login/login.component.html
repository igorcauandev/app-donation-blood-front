<!-- login.component.html -->
<div class="login-page">

  <!-- LADO ESQUERDO — Branding -->
  <div class="branding">
    <div class="logo-wrapper">
      <div class="logo-box">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="white"
             stroke="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6 2 2 9 2 13a10 10 0 0 0 20 0c0-4-4-11-10-11z"/>
        </svg>
      </div>
    </div>
    <h1 class="brand-name">HemoLife</h1>
    <p class="brand-sub">Banco de Sangue</p>
  </div>

  <!-- DIVISOR -->
  <div class="divider"></div>

  <!-- LADO DIREITO — Formulário -->
  <div class="form-side">
    <div class="form-card">

      <div class="form-header">
        <h2 class="form-titulo">Bem-vindo, colaborador!</h2>
        <p class="form-subtitulo">Faça login com sua conta institucional</p>
      </div>

      <!-- CAMPO USUÁRIO -->
      <div class="campo-wrapper" [class.campo-erro]="erro && !usuario">
        <span class="campo-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </span>
        <input
          class="campo-input"
          type="text"
          placeholder="Usuário institucional"
          [(ngModel)]="usuario"
          (keyup.enter)="entrar()"
          autocomplete="username"
        />
      </div>

      <!-- CAMPO SENHA -->
      <div class="campo-wrapper" [class.campo-erro]="erro && !senha">
        <span class="campo-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input
          class="campo-input"
          [type]="mostrarSenha ? 'text' : 'password'"
          placeholder="Senha"
          [(ngModel)]="senha"
          (keyup.enter)="entrar()"
          autocomplete="current-password"
        />
        <button class="btn-toggle-senha" type="button" (click)="toggleSenha()" tabindex="-1"
        [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
          <!-- Olho aberto -->
          <svg *ngIf="!mostrarSenha" width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- Olho fechado -->
          <svg *ngIf="mostrarSenha" width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <!-- ERRO -->
      <div class="msg-erro" *ngIf="erro">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ erro }}
      </div>

      <!-- ESQUECEU A SENHA -->
      <div class="link-row">
        <a class="link-esqueceu" href="#">Esqueceu a senha?</a>
      </div>

      <!-- BOTÃO ENTRAR -->
      <button class="btn-entrar" (click)="entrar()" [disabled]="carregando">
        <span *ngIf="!carregando">Entrar</span>
        <span *ngIf="carregando" class="spinner-wrapper">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
               class="spinner-icon">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/>
          </svg>
          Entrando...
        </span>
      </button>

      <!-- DICA DE ACESSO -->
      <p class="dica-acesso">
        Acesso demo: <strong>admin</strong> / <strong>123456</strong>
      </p>

    </div>
  </div>

</div>
