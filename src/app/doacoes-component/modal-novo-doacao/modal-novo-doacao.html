<!-- OVERLAY -->
<div class="modal-overlay" (click)="fecharModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">

    <!-- HEADER -->
    <div class="modal-header">
      <h2 class="modal-titulo">Registrar Doação</h2>
      <button class="btn-fechar" (click)="fecharModal()" title="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6"  y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- CORPO -->
    <div class="modal-body">

      <!-- ERRO -->
      <div class="alerta-erro" *ngIf="erroGeral">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8"  x2="12"   y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ erroGeral }}
      </div>

      <!-- SEÇÃO: VÍNCULO -->
      <div class="secao-titulo">Vínculo</div>

      <div class="form-linha">
        <div class="form-campo">
          <label class="form-label">
            ID do Paciente <span class="obrigatorio">*</span>
          </label>
          <input class="form-input" type="number"
                 placeholder="Ex: 1" min="1"
                 [(ngModel)]="form.idPaciente" />
          <span class="form-dica">Informe o ID do paciente cadastrado</span>
        </div>
        <div class="form-campo">
          <label class="form-label">ID do Centro</label>
          <input class="form-input" type="number"
                 placeholder="Ex: 2" min="1"
                 [(ngModel)]="form.idCentro" />
          <span class="form-dica">Opcional — deixe vazio se não houver</span>
        </div>
      </div>

      <!-- SEÇÃO: DADOS DA DOAÇÃO -->
      <div class="secao-titulo">Dados da Doação</div>

      <div class="form-linha">
        <div class="form-campo">
          <label class="form-label">
            Data da Doação <span class="obrigatorio">*</span>
          </label>
          <input class="form-input" type="date"
                 [(ngModel)]="form.dataDoacao" />
        </div>
        <div class="form-campo">
          <label class="form-label">Volume (ml)</label>
          <input class="form-input" type="number"
                 placeholder="Ex: 450" step="0.1" min="0"
                 [(ngModel)]="form.quantidade" />
          <span class="form-dica">Opcional — em mililitros</span>
        </div>
      </div>

      <!-- CARD RESUMO -->
      <div class="resumo-card" *ngIf="form.idPaciente > 0 && form.dataDoacao">
        <div class="resumo-linha">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Paciente #{{ form.idPaciente }}</span>
        </div>
        <div class="resumo-linha" *ngIf="form.idCentro">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Centro #{{ form.idCentro }}</span>
        </div>
        <div class="resumo-linha">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8"  y1="2" x2="8"  y2="6"/>
            <line x1="3"  y1="10" x2="21" y2="10"/>
          </svg>
          <span>{{ form.dataDoacao | date:'dd/MM/yyyy' }}</span>
        </div>
        <div class="resumo-linha" *ngIf="form.quantidade">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6 2 2 9 2 13a10 10 0 0 0 20 0c0-4-4-11-10-11z"/>
          </svg>
          <span>{{ form.quantidade }} ml</span>
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="modal-footer">
      <button class="btn-cancelar" (click)="fecharModal()" [disabled]="salvando">
        Cancelar
      </button>
      <button class="btn-salvar" (click)="salvar()" [disabled]="salvando">
        <span *ngIf="!salvando">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Registrar Doação
        </span>
        <span *ngIf="salvando" class="salvando-spinner">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
               class="spinner-icon">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/>
          </svg>
          Salvando...
        </span>
      </button>
    </div>

  </div>
</div>
