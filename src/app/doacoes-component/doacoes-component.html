<!-- doacoes-component.html -->
<div class="doacoes-wrapper">

  <!-- CABEÇALHO -->
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">Doações</h1>
      <p class="page-subtitle">{{ doacoes.length }} doações registradas</p>
    </div>
    <button class="btn-novo" (click)="registrarDoacao()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Registrar Doação
    </button>
  </div>

  <!-- BUSCA -->
  <div class="search-wrapper">
    <span class="search-icon">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </span>
    <input
      class="search-input"
      type="text"
      placeholder="Buscar por paciente, centro ou data..."
      [(ngModel)]="busca"
    />
  </div>

  <!-- TABELA -->
  <div class="table-container">
    <table class="tabela">
      <thead>
        <tr>
          <th>#</th>
          <th>Paciente (ID)</th>
          <th>Centro (ID)</th>
          <th>Data da Doação</th>
          <th>Volume</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let d of doacoesFiltradas">

          <!-- ID -->
          <td class="td-id">{{ d.id }}</td>

          <!-- Paciente -->
          <td class="td-doador">Paciente #{{ d.idPaciente }}</td>

          <!-- Centro -->
          <td class="td-centro">
            <span *ngIf="d.idCentro != null">Centro #{{ d.idCentro }}</span>
            <span *ngIf="d.idCentro == null" class="sem-valor">—</span>
          </td>

          <!-- Data -->
          <td class="td-data">{{ formatarData(d.dataDoacao) }}</td>

          <!-- Volume -->
          <td class="td-volume">{{ formatarVolume(d.quantidade) }}</td>

          <!-- Ações -->
          <td class="td-acoes">
            <button class="btn-acao btn-editar" (click)="editarDoacao(d)" title="Editar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="btn-acao btn-excluir" (click)="excluirDoacao(d.id)" title="Excluir">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6"/><path d="M14 11v6"/>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
              </svg>
            </button>
          </td>

        </tr>

        <!-- Sem resultados -->
        <tr *ngIf="doacoesFiltradas.length === 0">
          <td colspan="6" class="sem-resultados">Nenhuma doação encontrada.</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- MODAL -->
<app-modal-nova-doacao
  *ngIf="modalAberto"
  (fechar)="fecharModal()"
  (doacaoCriada)="aoDoacaoCriada($event)"
/>

<app-modal-atualizar-doacao
  *ngIf="modalEditarAberto && doacaoParaEditar"
  [doacao]="doacaoParaEditar!"
  (fechar)="fecharModalEditar()"
  (doacaoAtualizada)="aoDoacaoAtualizada($event)"
/>
