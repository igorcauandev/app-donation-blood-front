<!-- OVERLAY -->
<div class="modal-overlay" (click)="fecharModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">

    <!-- HEADER -->
    <div class="modal-header">
      <h2 class="modal-titulo">Atualizar Doação</h2>
      <button class="btn-fechar" (click)="fecharModal()" title="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6"  y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- CORPO -->
    <div class="modal-body">

      <!-- ERRO -->
      <div class="alerta-erro" *ngIf="erroGeral">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8"  x2="12"   y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ erroGeral }}
      </div>

      <!-- ID do Paciente -->
      <div class="form-campo">
        <label class="form-label">
          ID do Paciente <span class="obrigatorio">*</span>
        </label>
        <div class="input-wrapper">
          <input
            class="form-input"
            type="number"
            placeholder="Informe o ID do paciente"
            min="1"
            [(ngModel)]="form.idPaciente"
          />
          <svg class="input-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>

      <!-- Linha: Data + Centro -->
      <div class="form-linha">
        <div class="form-campo">
          <label class="form-label">Data da Doação <span class="obrigatorio">*</span></label>
          <input
            class="form-input"
            type="date"
            [(ngModel)]="form.dataDoacao"
          />
        </div>
        <div class="form-campo">
          <label class="form-label">ID do Centro</label>
          <div class="input-wrapper">
            <input
              class="form-input"
              type="number"
              placeholder="Opcional"
              min="1"
              [(ngModel)]="form.idCentro"
            />
            <svg class="input-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Linha: Volume -->
      <div class="form-linha">
        <div class="form-campo">
          <label class="form-label">Volume (ml)</label>
          <input
            class="form-input"
            type="number"
            placeholder="Ex: 450"
            step="0.1"
            min="0"
            [(ngModel)]="form.quantidade"
          />
        </div>
        <!-- Espaço reservado para manter grid 2 colunas -->
        <div class="form-campo"></div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="modal-footer">
      <button class="btn-cancelar" (click)="fecharModal()" [disabled]="salvando">
        Cancelar
      </button>
      <button class="btn-salvar" (click)="salvar()" [disabled]="salvando">
        <span *ngIf="!salvando">Atualizar</span>
        <span *ngIf="salvando" class="salvando-spinner">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
               class="spinner-icon">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/>
          </svg>
          Salvando...
        </span>
      </button>
    </div>

  </div>
</div>
