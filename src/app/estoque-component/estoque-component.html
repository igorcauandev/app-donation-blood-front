<!-- estoque.component.html -->
<div class="estoque-wrapper">

  <!-- CABEÇALHO -->
  <div class="page-header">
    <h1 class="page-title">Estoque de Sangue</h1>
    <p class="page-subtitle">Gestão de estoque por tipo sanguíneo</p>
  </div>

  <!-- CARD TOTAL -->
  <div class="total-card">
    <span class="total-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E53E3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C6 2 2 9 2 13a10 10 0 0 0 20 0c0-4-4-11-10-11z"/>
      </svg>
    </span>
    <div class="total-info">
      <span class="total-label">Total de Unidades em Estoque</span>
      <span class="total-valor">{{ totalUnidades }}</span>
    </div>
  </div>

  <!-- GRID DE TIPOS -->
  <div class="stock-grid">
    <div
      class="stock-card"
      *ngFor="let item of estoques"
      [ngClass]="getCardClass(item)"
    >
      <!-- Topo: tipo + quantidade -->
      <div class="card-top">
        <div class="tipo-row">
          <span class="drop-icon" [ngClass]="getDropClass(item)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6 2 2 9 2 13a10 10 0 0 0 20 0c0-4-4-11-10-11z"/>
            </svg>
          </span>
          <div class="tipo-info">
            <span class="tipo-nome">{{ item.tipo }}</span>
            <span class="tipo-status" [ngClass]="getStatusClass(item)">{{ item.status }}</span>
          </div>
        </div>
        <span class="quantidade">{{ item.quantidade }}</span>
      </div>

      <!-- Barra de progresso -->
      <div class="progress-track">
        <div
          class="progress-fill"
          [ngClass]="getProgressClass(item)"
          [style.width.%]="getProgressoPercent(item)"
        ></div>
      </div>

      <!-- Rodapé: Estoque / Mínimo — substitui o card-footer existente -->
<!-- Rodapé: Estoque / Mínimo -->
<div class="card-footer">
  <span class="label-estoque">Estoque</span>

  <div class="footer-acoes">
    <!-- botão sempre visível — edita a primeira bolsa se houver, senão abre o modal de adicionar -->
    <button
      class="btn-editar-card"
      [title]="item.bolsas.length > 0 ? 'Editar bolsa #' + item.bolsas[0].id : 'Nenhuma bolsa para editar'"
      [disabled]="item.bolsas.length === 0"
      (click)="item.bolsas.length > 0 ? abrirAtualizarBolsa(item.bolsas[0]) : null"
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>
    <span class="label-min">Min: {{ item.minimo }}</span>
  </div>
</div>
    </div>
  </div>

</div>

<!-- MODAL ATUALIZAR — no final do arquivo, fora do wrapper -->
<app-modal-atualizar-bolsa
  *ngIf="modalAtualizarAberto && bolsaParaAtualizar"
  [bolsa]="bolsaParaAtualizar!"
  (fechar)="fecharModalAtualizar()"
  (bolsaAtualizada)="aoBolsaAtualizada()"
/>
